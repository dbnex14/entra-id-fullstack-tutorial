<header class="app-bar">
  <span class="app-bar__title">Item Manager</span>

  <!-- Feature navigation. The guards on these routes still decide access;
       these links are just the way to reach them. -->
  <nav class="app-bar__nav">
    <a routerLink="/dashboard" routerLinkActive="is-active">Dashboard</a>
    <a routerLink="/admin" routerLinkActive="is-active">Admin</a>
  </nav>

  <!-- Identity + auth control, pushed to the right. Shows the signed-in roles
       and a Sign out button when authenticated; otherwise a Sign in button. -->
  <div class="app-bar__auth">
    @if (isAuthenticated()) {
      <output class="app-bar__identity">
        Signed in
        @if (roles().length > 0) {
          — <span class="app-bar__roles">{{ roles().join(', ') }}</span>
        }
      </output>
      <button type="button" class="app-bar__btn" (click)="signOut()">Sign out</button>
    } @else {
      <output class="app-bar__identity">Not signed in</output>
      <button type="button" class="app-bar__btn" (click)="signIn()">Sign in</button>
    }
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>
